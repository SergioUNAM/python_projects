name: Demo tests

on:
  push:
    branches:
      - job/upwork-spreadsheet-mapping-demo-2094678141518489692
      - demo/upwork-spreadsheet-mapping-2094678141518489692
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pipeline
        run: python src/clean_mapping.py
      - name: Run tests
        run: python -m unittest discover -s tests -v

